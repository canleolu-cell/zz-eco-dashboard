<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-layout="top" data-spot="std">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZZ ECO · 全球电池回收运营中心</title>
<style>
/* ============ 设计令牌（苹果系统色系） ============ */
:root{
  --bg:#fbfbfd; --panel:#ffffff; --panel-2:#f5f5f7;
  --text:#1d1d1f; --muted:#6e6e73; --muted-2:#86868b; --line:rgba(0,0,0,.09);
  --blue:#0071e3; --purple:#5e5ce6; --pink:#ff375f; --orange:#ff9f0a;
  --green:#30d158; --cyan:#40c8e0; --indigo:#7d7aff; --teal:#30b0c7;
  --primary:var(--blue); --primary-soft:rgba(0,113,227,.10); --primary-soft-2:rgba(0,113,227,.28);
  --up:#ff375f; --down:#30d158;
  --shadow-s:0 2px 10px rgba(0,0,0,.05);
  --shadow-m:0 10px 34px rgba(0,0,0,.10);
  --shadow-l:0 34px 70px rgba(0,0,0,.16);
  --r:22px; --r-m:14px; --r-s:10px;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-back:cubic-bezier(.34,1.56,.64,1);
  --t-theme:.4s var(--ease-out);
  --nav-h:52px;
}
html[data-theme="dark"]{
  --bg:#000000; --panel:#1d1d1f; --panel-2:#161617;
  --text:#f5f5f7; --muted:#86868b; --muted-2:#6e6e73; --line:rgba(255,255,255,.12);
  --blue:#0a84ff; --purple:#7d7aff; --pink:#ff453a; --orange:#ff9f0a;
  --green:#30d158; --cyan:#64d2ff; --indigo:#5e5ce6; --teal:#40c8e0;
  --primary:var(--blue); --primary-soft:rgba(10,132,255,.18); --primary-soft-2:rgba(10,132,255,.4);
  --shadow-s:0 2px 10px rgba(0,0,0,.5);
  --shadow-m:0 10px 34px rgba(0,0,0,.6);
  --shadow-l:0 34px 70px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;
  transition:background var(--t-theme),color var(--t-theme)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--primary-soft-2)}

/* ============ 背景彩色光球 ============ */
.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(100px);opacity:.42;
  animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;background:var(--blue);left:-8%;top:-14%;animation-delay:0s}
.aurora i:nth-child(2){width:460px;height:460px;background:var(--purple);right:-6%;top:6%;animation-delay:-4s}
.aurora i:nth-child(3){width:420px;height:420px;background:var(--pink);left:26%;bottom:-20%;animation-delay:-9s}
.aurora i:nth-child(4){width:380px;height:380px;background:var(--cyan);right:12%;bottom:-12%;animation-delay:-14s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(60px,-50px,0) scale(1.18)}}
html[data-theme="dark"] .aurora i{opacity:.3}

/* ============ 顶部毛玻璃导航（苹果风） ============ */
.navbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:60;display:flex;align-items:center;gap:6px;
  padding:0 22px;background:rgba(251,251,253,.72);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);
  transition:background var(--t-theme),border-color var(--t-theme)}
html[data-theme="dark"] .navbar{background:rgba(22,22,23,.72)}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-.3px;margin-right:14px;flex:none}
.brand .mark{width:22px;height:22px;border-radius:7px;flex:none;
  background:linear-gradient(135deg,var(--blue),var(--purple) 55%,var(--pink));
  box-shadow:0 3px 10px rgba(94,92,230,.4)}
.navlist{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden}
.nv{position:relative;padding:6px 13px;border-radius:11px;font-size:13px;color:var(--muted);white-space:nowrap;
  transition:color .2s var(--ease-out),background .2s var(--ease-out),transform .34s var(--ease-back)}
.nv:hover{color:var(--text);background:var(--primary-soft)}
.nv.on{color:var(--text);font-weight:600}
.nv .ic{display:inline-block;width:13px;height:13px;margin-right:6px;vertical-align:-2px;border-radius:4px;
  background:linear-gradient(135deg,var(--blue),var(--purple))}
.nav-right{display:flex;align-items:center;gap:10px;flex:none}
.sbox{position:relative}
.sbox input{width:190px;height:30px;padding:0 12px 0 30px;border-radius:15px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:12.5px;outline:none;
  transition:width .34s var(--ease-back),box-shadow .24s var(--ease-out),background .2s}
.sbox input:focus{width:250px;box-shadow:0 0 0 3px var(--primary-soft);background:var(--panel)}
.sbox svg{position:absolute;left:10px;top:8px;width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2}
.sugg{position:absolute;top:38px;right:0;width:290px;background:rgba(255,255,255,.86);z-index:70;
  backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-m);
  padding:6px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .24s var(--ease-out)}
html[data-theme="dark"] .sugg{background:rgba(29,29,31,.88)}
.sugg.show{opacity:1;transform:none;pointer-events:auto}
.sugg .t{font-size:10.5px;color:var(--muted-2);padding:6px 8px 4px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.sugg .it{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;font-size:12.5px;transition:background .16s}
.sugg .it:hover{background:var(--primary-soft)}
.iconbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);
  transition:background .2s,transform .3s var(--ease-back)}
.iconbtn:hover{background:var(--primary-soft);transform:scale(1.12)}
.iconbtn svg{width:15px;height:15px;stroke:var(--text);fill:none;stroke-width:1.8}

/* 通栏下落面板 */
.mega{position:fixed;top:var(--nav-h);left:0;right:0;z-index:55;overflow:hidden;max-height:0;
  background:rgba(251,251,253,.86);backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid var(--line);transition:max-height .38s var(--ease-out),opacity .26s;opacity:0}
html[data-theme="dark"] .mega{background:rgba(22,22,23,.86)}
.mega.open{max-height:340px;opacity:1}
.mega-in{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:22px;max-width:1240px;margin:0 auto}
.mc{padding:14px;border-radius:var(--r-m);transition:background .22s,transform .34s var(--ease-back)}
.mc:hover{background:var(--panel);transform:translateY(-3px);box-shadow:var(--shadow-s)}
.mc .mi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:9px;color:#fff}
.mc .mi svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.mc b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.mc span{font-size:11.5px;color:var(--muted);line-height:1.45}

/* ============ 侧边栏（布局二） ============ */
.sidebar{position:fixed;top:var(--nav-h);left:0;bottom:0;width:238px;z-index:50;padding:14px 12px;overflow-y:auto;
  background:rgba(251,251,253,.6);backdrop-filter:blur(20px);border-right:1px solid var(--line);display:none}
html[data-layout="sidebar"] .sidebar{display:block}
html[data-theme="dark"] .sidebar{background:rgba(22,22,23,.6)}
.smenu{position:relative}
.hl{position:absolute;left:0;right:0;top:0;height:38px;pointer-events:none;transform:translateY(0);
  transition:transform .35s var(--ease-back)}
.hl .pill{height:100%;border-radius:11px;background:var(--primary-soft);border:1px solid var(--primary-soft-2);
  transition:width .35s var(--ease-back),height .35s var(--ease-back)}
.hl.stretch .pill{animation:squish .35s var(--ease-out)}
@keyframes squish{0%{transform:scaleY(1)}45%{transform:scaleY(1.14)}100%{transform:scaleY(1)}}
.srow{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:11px;
  font-size:13px;color:var(--muted);cursor:pointer;z-index:1;
  transition:color .2s,transform .34s var(--ease-back),background .2s}
.srow.on{color:var(--text);font-weight:600}
.srow .ic{width:16px;height:16px;border-radius:5px;flex:none}
.srow .ar{margin-left:auto;font-size:10px;transition:transform .28s var(--ease-out);color:var(--muted-2)}
.grp.open .ar{transform:rotate(90deg)}
.grp.open .srow{color:var(--text)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;
  font-size:10.5px;font-weight:600;display:grid;place-items:center;margin-left:auto;
  transition:transform .22s var(--ease-back),opacity .22s}
.badge.gone{transform:scale(0);opacity:0}
.dotp{width:7px;height:7px;border-radius:50%;background:var(--orange);margin-left:auto;position:relative;flex:none}
.dotp::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--orange);
  animation:breathe 2s infinite}
@keyframes breathe{0%{transform:scale(.6);opacity:.9}70%{transform:scale(2);opacity:0}100%{opacity:0}}
.subs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease-out)}
.grp.open .subs{grid-template-rows:1fr}
.subs>.in{overflow:hidden;position:relative;padding-left:22px}
.subs>.in::before{content:"";position:absolute;left:12px;top:4px;bottom:6px;width:1px;background:var(--line);
  transform:scaleY(0);transform-origin:top;transition:transform .3s var(--ease-out)}
.grp.open .subs>.in::before{transform:scaleY(1)}
.srow.sub{height:32px;font-size:12.5px}
.grp.open .srow.sub{animation:slidein .34s var(--ease-out) both}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* ============ 底部停靠栏（布局三） ============ */
.dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:58;display:none;
  padding:8px 10px;border-radius:20px;gap:4px;align-items:flex-end;
  background:rgba(251,251,253,.76);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--shadow-m)}
html[data-layout="dock"] .dock{display:flex}
html[data-theme="dark"] .dock{background:rgba(29,29,31,.8)}
.di{position:relative;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  transition:transform .28s var(--ease-back),margin .28s var(--ease-back)}
.di .ic{width:26px;height:26px;border-radius:8px}
.di .nm{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s,transform .22s var(--ease-out);box-shadow:var(--shadow-s)}
.di:hover .nm{opacity:1;transform:translateX(-50%) translateY(0)}
.di.on::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--text)}

/* ============ 内容区 ============ */
.content{position:relative;z-index:1;padding:calc(var(--nav-h) + 26px) 22px 60px;max-width:1240px;margin:0 auto;min-height:100vh}
html[data-layout="sidebar"] .content{margin-left:238px;max-width:none}
html[data-layout="dock"] .content{padding-bottom:110px}
.page{animation:pageIn .42s var(--ease-out)}
@keyframes pageIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.leaving{animation:pageOut .2s var(--ease-out) forwards!important}
@keyframes pageOut{to{opacity:0;transform:translateX(-28px)}}

/* Hero（苹果式大标题） */
.hero{margin:14px 0 30px;animation:heroIn .7s var(--ease-out) both}
@keyframes heroIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.hero .eyebrow{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:.2px;margin-bottom:8px}
.hero h1{margin:0;font-size:clamp(34px,5.2vw,58px);font-weight:700;letter-spacing:-1.8px;line-height:1.05;
  background:linear-gradient(94deg,var(--blue),var(--purple) 34%,var(--pink) 66%,var(--orange));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:12px 0 0;font-size:19px;color:var(--muted);font-weight:400;letter-spacing:-.2px;max-width:640px;line-height:1.45}
.hero .cta{margin-top:20px;display:flex;gap:10px}
.btn-capsule{padding:10px 22px;border-radius:980px;background:var(--blue);color:#fff;font-size:14px;font-weight:500;
  transition:transform .28s var(--ease-back),box-shadow .28s var(--ease-out),background .2s}
.btn-capsule:hover{transform:scale(1.045);box-shadow:0 10px 26px rgba(0,113,227,.36)}
.btn-capsule:active{transform:scale(.97)}
.btn-ghost{padding:10px 22px;border-radius:980px;border:1px solid var(--line);color:var(--text);font-size:14px;
  transition:transform .28s var(--ease-back),background .2s}
.btn-ghost:hover{transform:scale(1.045);background:var(--panel-2)}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:4px 0 20px;flex-wrap:wrap}
.ph h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.8px}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 14px;border-radius:980px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);font-size:12.5px;transition:all .22s var(--ease-out)}
.chip:hover{border-color:var(--primary-soft-2);color:var(--text);transform:scale(1.04)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:500}

/* ============ 卡片 ============ */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.55fr 1fr}
.g21{grid-template-columns:1fr 1.55fr}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.g21{grid-template-columns:1fr}}
@media(max-width:640px){.g4{grid-template-columns:1fr}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;box-shadow:var(--shadow-s);transform-origin:50% 62%;overflow:hidden;
  transition:background var(--t-theme),border-color .3s var(--ease-out),box-shadow .4s var(--ease-out),
             opacity .28s var(--ease-out),filter .28s var(--ease-out),transform .45s var(--ease-back)}
.card h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.card .sub{margin:3px 0 0;color:var(--muted);font-size:11.5px}

/* ---- 悬停聚光 · 骤然光亮 ---- */
.content.spot .card{opacity:.16;filter:saturate(.05) brightness(.94);transform:scale(.955)}
.content.spot .card.lit{opacity:1;filter:none;transform:scale(1.035) translateY(-8px);z-index:5;
  box-shadow:var(--shadow-l),0 0 0 1px var(--primary-soft-2)}
.content.spot .card.lit::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),transparent 60%);
  mix-blend-mode:overlay}
html[data-theme="dark"] .content.spot .card.lit::before{background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 60%)}
.content.spot .card.lit::after{content:"";position:absolute;top:0;left:8%;right:8%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--blue),var(--purple),var(--pink),transparent);
  background-size:240% 100%;animation:sweep .8s var(--ease-out)}
@keyframes sweep{from{background-position:-130% 0}to{background-position:130% 0}}
/* 骤然：进入瞬间闪一下 */
.card.ignite{animation:ignite .45s var(--ease-out)}
@keyframes ignite{0%{filter:brightness(1) saturate(1)}28%{filter:brightness(1.55) saturate(1.35)}100%{filter:brightness(1) saturate(1)}}
html[data-spot="soft"] .content.spot .card{opacity:.58;filter:saturate(.7);transform:scale(.99)}
html[data-spot="soft"] .content.spot .card.lit{transform:scale(1.014) translateY(-3px)}
html[data-spot="hard"] .content.spot .card{opacity:.1;filter:saturate(0);transform:scale(.94)}
html[data-spot="hard"] .content.spot .card.lit{transform:scale(1.045) translateY(-11px)}
html[data-spot="off"] .content.spot .card{opacity:1;filter:none;transform:none}
html[data-spot="off"] .content.spot .card.lit{transform:translateY(-2px)}

/* 同级聚光 */
[data-peer]{transition:opacity .3s var(--ease-out),filter .3s var(--ease-out),
  transform .36s var(--ease-back),background .2s var(--ease-out),color .2s var(--ease-out)}
[data-peers].spot [data-peer]{opacity:.26;filter:saturate(.2)}
[data-peers].spot [data-peer].lit{opacity:1;filter:none}
html[data-spot="soft"] [data-peers].spot [data-peer]{opacity:.58;filter:saturate(.7)}
html[data-spot="off"] [data-peers].spot [data-peer]{opacity:1;filter:none}
#navbar.spot .nv.lit{color:var(--text);background:var(--primary-soft);transform:translateY(-2px)}
#mega.spot .mc.lit{background:var(--panel);transform:translateY(-3px) scale(1.03);box-shadow:var(--shadow-s)}
[data-peers].spot .bar-row[data-peer]:not(.lit){transform:scale(.985)}
.bar-row.lit{transform:scale(1.035)}
.bar-row.lit .bf{filter:brightness(1.18) saturate(1.25)}
.bar-row.lit .v{font-weight:700}
circle[data-peer]{transform-box:fill-box;transform-origin:center}
[data-peers].spot circle[data-peer]{opacity:.18;filter:saturate(.2)}
[data-peers].spot circle[data-peer].lit{opacity:1;filter:none;transform:scale(1.06)}
[data-peers].spot .fi.lit,[data-peers].spot .td.lit{background:var(--primary-soft);transform:translateX(3px)}
#sidebar.spot .srow.lit{background:var(--primary-soft);transform:translateX(4px)}

/* 入场错开 */
.card.enter{animation:cardIn .58s var(--ease-out) both}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.965)}to{opacity:1;transform:none}}

/* ============ KPI ============ */
.kpi{overflow:hidden}
.kpi .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.kpi .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;
  box-shadow:0 5px 14px rgba(0,0,0,.14)}
.kpi .ic svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.9}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{font-size:36px;font-weight:700;letter-spacing:-1.4px;font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;gap:4px;transition:filter .22s var(--ease-out),color .22s}
.kpi .val.rolling{filter:blur(.6px);color:var(--blue)}
.kpi .val small{font-size:15px;font-weight:500;color:var(--muted)}
.kpi .dl{font-size:12px;display:flex;align-items:center;gap:4px;color:var(--muted);margin-top:6px}
.kpi .dl b{font-weight:600}
.kpi .spark{margin-top:12px;height:32px}
.spark polyline{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.1s var(--ease-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ============ 图表 ============ */
.cbox{position:relative}
.cbox svg{display:block;width:100%;height:auto;overflow:visible}
.lc .ln{stroke-dasharray:1800;stroke-dashoffset:1800;animation:draw 1.4s var(--ease-out) forwards}
.lc .ar{animation:fadeUp .85s .2s var(--ease-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.lc circle{transform-box:fill-box;transform-origin:center;transition:r .2s var(--ease-back);
  animation:popIn .45s var(--ease-back) both}
@keyframes popIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-m);padding:9px 12px;font-size:12px;opacity:0;transform:translate(-50%,-118%);
  white-space:nowrap;z-index:6;transition:opacity .16s,left .18s var(--ease-out),top .18s var(--ease-out)}
.tip.show{opacity:1}
.tip b{font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}

/* ============ 组件函数 ============ */
function kpiCard(k,i){
  return '<div class="card kpi" data-peer><div class="top">'+
    '<div class="ic" style="background:linear-gradient(135deg,'+C[k.c]+',rgba(0,0,0,.15))">'+ico(['bolt','clock','ship','shield'][i],17)+'</div>'+
    '<div><div class="lb">'+k.lb+'</div></div></div>'+
    '<div class="val" data-val="'+i+'" style="color:'+C[k.c]+'">0<small>'+k.u+'</small></div>'+
    '<div class="dl"><span style="color:'+(k.dl[0]>=0?'var(--up)':'var(--down)')+'">'+(k.dl[0]>=0?'▲':'▼')+' '+Math.abs(k.dl[0])+'%</span><span>'+k.dl[1]+'</span></div>'+
    '<div class="spark">'+spark(k.sp,C[k.c])+'</div></div>';
}
function spark(d,c){
  const W=200,H=32,mn=Math.min(...d),mx=Math.max(...d);
  const X=i=>i/(d.length-1)*W, Y=v=>H-((v-mn)/((mx-mn)||1)*(H-6)+3);
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100%">'+
    '<polyline points="'+d.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'" stroke="'+c+'"/></svg>';
}
let gid=0;
function lineChart(d,c1,c2,labels){
  const W=760,H=240,mn=Math.min(...d)*.86,mx=Math.max(...d)*1.06;
  const X=i=>i/(d.length-1)*W,Y=v=>H-((v-mn)/((mx-mn)||1)*H*.8+H*.1);
  const id='g'+(++gid),pts=d.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));
  return '<div class="cbox" data-box><svg viewBox="0 0 '+W+' '+H+'" class="lc">'+
   '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
   '<stop offset="0%" stop-color="'+c1+'" stop-opacity=".34"/><stop offset="100%" stop-color="'+c1+'" stop-opacity="0"/></linearGradient></defs>'+
   [.25,.5,.75].map(r=>'<line x1="0" y1="'+(H*r)+'" x2="'+W+'" y2="'+(H*r)+'" stroke="var(--line)" stroke-width="1"/>').join('')+
   '<path class="ar" d="M0,'+H+' L'+pts.join(' L')+' L'+W+','+H+' Z" fill="url(#'+id+')"/>'+
   '<polyline class="ln" points="'+pts.join(' ')+'" fill="none" stroke="'+c1+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'+
   d.map((v,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.4" fill="var(--panel)" stroke="'+c1+'" stroke-width="2.2" data-pt="'+i+'" data-v="'+v+'" style="animation-delay:'+(350+i*60)+'ms"/>').join('')+
   '<line class="cross" x1="0" y1="0" x2="0" y2="'+H+'" stroke="'+c1+'" stroke-width="1" stroke-dasharray="3 3" opacity="0"/></svg>'+
   '<div class="tip"></div></div>';
}
function donut(items){
  const total=items.reduce((a,b)=>a+b.v,0);let acc=0;const R=58,Cc=2*Math.PI*R;
  const segs=items.map((it,i)=>{
    const len=it.v/total*Cc;
    const o='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+it.c+'" stroke-width="17" data-peer data-sync="dn'+i+'" '+
      'stroke-dasharray="'+len.toFixed(1)+' '+(Cc-len).toFixed(1)+'" stroke-dashoffset="'+(-acc).toFixed(1)+'" '+
      'transform="rotate(-90 70 70)" style="stroke-dasharray:0 '+Cc+';transition:stroke-dasharray .9s var(--ease-out)"/>';
    acc+=len;return o;
  }).join('');
  return '<div class="donut-wrap" data-peers><svg viewBox="0 0 140 140" style="width:150px;height:150px;flex:none">'+segs+'</svg>'+
   '<div style="flex:1;min-width:150px">'+items.map((it,i)=>
     '<div class="dg-row" data-peer data-sync="dn'+i+'"><i style="background:'+it.c+'"></i><span>'+it.n+'</span><b>'+it.v+'%</b></div>').join('')+
   '</div></div>';
}
function bars(list){
  return '<div data-peers>'+list.map(b=>
    '<div class="bar-row" data-peer><span>'+b[0]+'</span><div class="bt"><div class="bf" data-w="'+b[1]+'" '+
    'style="background:linear-gradient(90deg,'+C[b[2]]+',rgba(0,0,0,.12))"></div></div><span class="v">'+b[1]+'%</span></div>').join('')+'</div>';
}

function todos(){

function table(rows){

function countUp(){
  const set=KDATA[S.range]||KDATA['30d'];
  $$('[data-val]').forEach(el=>{
    const i=+el.dataset.val,tgt=set[i],dec=tgt%1?1:0;
    const prev=(KLAST[i]===undefined?0:KLAST[i]);
    const unit=el.querySelector('small').outerHTML,t0=performance.now(),dur=950;
    el.classList.add('rolling');el.dataset.done='0';
    const fin=()=>{el.dataset.done='1';el.classList.remove('rolling');
      el.innerHTML=(dec?tgt.toFixed(1):fmt(tgt))+unit;KLAST[i]=tgt};
    (function step(t){
      if(el.dataset.done==='1')return;
      const p=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-p,4),v=prev+(tgt-prev)*e;
      el.innerHTML=(dec?v.toFixed(1):fmt(v))+unit;
      if(p<1)requestAnimationFrame(step);else fin();
    })(t0);
    setTimeout(()=>{if(el.dataset.done!=='1')fin()},dur+150);
  });
}
function bindChart(box){
  const svg=box.querySelector('svg');if(!svg)return;
  const cross=svg.querySelector('.cross'),pts=[...svg.querySelectorAll('circle[data-pt]')],tip=box.querySelector('.tip');
  if(!cross||!pts.length||!tip)return;
  svg.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*760;
    let best=0,bd=1e9;
    pts.forEach((p,i)=>{const d=Math.abs(+p.getAttribute('cx')-x);if(d<bd){bd=d;best=i}});
    const p=pts[best],cx=+p.getAttribute('cx'),cy=+p.getAttribute('cy');
    cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.setAttribute('opacity','.5');
    pts.forEach((q,j)=>q.setAttribute('r',j===best?5.6:3.4));
    tip.classList.add('show');
    tip.innerHTML='<div class="k">第 '+(best+1)+' 周</div><b>'+fmt(+p.dataset.v)+'</b>';
    tip.style.left=(cx/760*r.width)+'px';tip.style.top=(cy/240*r.height)+'px';
  });
  svg.addEventListener('mouseleave',()=>{cross.setAttribute('opacity','0');pts.forEach(q=>q.setAttribute('r',3.4));tip.classList.remove('show')});
}

    '<span>'+msgs[i]+'</span><span class="t2">刚刚</span>';

  while(wrap.children.length>6)wrap.lastChild.remove();
},11000);

/* ============ 启动 ============ */
renderNav();syncNav();renderPage();
window.addEventListener('resize',()=>{moveHL();const th=document.querySelector('#seg2 .th');if(th)bindSeg()});
</script>
